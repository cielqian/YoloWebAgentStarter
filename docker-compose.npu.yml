# 昇腾 310P3 推理卡部署，与主文件叠加使用：
#   docker compose -f docker-compose.yml -f docker-compose.npu.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.npu
    image: yolowebagent-starter-backend-npu
    environment:
      YWA_SAM_DEVICE: npu:0
    volumes:
      # CANN toolkit 与驱动均来自宿主机，版本必须与镜像内 torch-npu 配套
      - /usr/local/Ascend/ascend-toolkit:/usr/local/Ascend/ascend-toolkit
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
    devices:
      # 单卡；多卡按 davinci1、davinci2 追加
      - /dev/davinci0
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
